services:
  db:
    image: postgres:17
    container_name: test-usage-metering-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usage-metering-service-example}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-usage-metering-api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usage-metering-service-example}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DB_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-usage-metering-service-example}
      PORT: "8080"
      PLATFORM: "production"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && npm run seed && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-usage-metering-demo
    restart: no
    depends_on:
      api:
        condition: service_healthy
    environment:
      PLATFORM: "production"
    command: ["sh", "-c", "npm run demo:prod"]

volumes:
  postgres_test_data: